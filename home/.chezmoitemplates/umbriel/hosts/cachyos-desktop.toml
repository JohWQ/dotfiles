[[window_rule]]
match.app_id = "Scratchpad$"
default_floating_size = { height = 0.9809 }
default_floating_size_px = { width = 944 }

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating_size = { height = 0.8604 }
default_floating_size_px = { width = 1020 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating_size = { height = 0.5736 }
default_floating_size_px = { width = 800 }

[[window_rule]]
match.title = ["^File chooser$", "^File view$"]
default_floating_size = { height = 0.956 }
default_floating_size_px = { width = 1060 }

[[window_rule]]
match.app_id = "^wev$"
default_scrolling_extent_px = 250

[[window_rule]]
match.app_id = "^virt-manager$"
match.title = "^Virtual Machine Manager$"
default_scrolling_extent_px = 315

# Desktop outputs and output routing. Later rules override the shared ones.
[output.DP-1]
mode = "1920x1080@143.999"
position = [0, 0]
# scale = 1.25
# vrr = "fullscreen"
# hdr = "auto"
# sdr_transfer = "gamma22" # Or "srgb" for piecewise SDR decoding in HDR.

[output.DP-3]
mode = "1920x1080@144.000"
transform = "270"
position = [1920, -374]
# scale = 1.25
# vrr = "fullscreen"
# hdr = "auto"
# sdr_transfer = "gamma22" # Or "srgb" for piecewise SDR decoding in HDR.

[output.HDMI-A-1]
enabled = false

[output.DP-3.layout.scrolling]
default_extent_fraction = 1.0

[[window_rule]]
match.app_id = ["^com.github.th-ch.youtube-music$", "^vesktop$", "^steam$"]
default_output = "DP-3"

# pear-desktop opens on the second workspace of the vertical monitor.
[[window_rule]]
match.app_id = "^com.github.th-ch.youtube-music$"
default_output = "DP-3"
default_workspace = 2
