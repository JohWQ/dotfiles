# Desktop outputs and output routing. Later rules override the shared ones.
[output.DP-1]
mode = "1920x1080@143.999"
position = [0, 0]
# scale = 1.25
# vrr = "fullscreen"
# hdr = "auto"
# sdr_transfer = "gamma22" # Or "srgb" for piecewise SDR decoding in HDR.

[output.DP-3]
mode = "1920x1080@144.000"
transform = "270"
position = [1920, -374]
# scale = 1.25
# vrr = "fullscreen"
# hdr = "auto"
# sdr_transfer = "gamma22" # Or "srgb" for piecewise SDR decoding in HDR.

[output.HDMI-A-1]
enabled = false

[output.DP-3.layout.scrolling]
default_extent_fraction = 1.0

[[window_rule]]
match.app_id = ["^com.github.th-ch.youtube-music$", "^vesktop$", "^steam$"]
default_output = "DP-3"

# pear-desktop opens on the second workspace of the vertical monitor.
[[window_rule]]
match.app_id = "^com.github.th-ch.youtube-music$"
default_output = "DP-3"
default_workspace = 2
