# Overrides for cachyos-laptop, captured from local Noctalia settings.
# Private location settings are stored in cachyos-laptop.age.
[bar]
  [bar.default]
    end = ["clock", "tray", "bar", "bar_2", "recorder", "bar_3", "weather", "notifications", "clipboard", "network", "volume", "battery", "session", "shelly"]

[lockscreen_widgets]
  widget_order = ["lockscreen-login-box@eDP-1"]
  [lockscreen_widgets.widget]
    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
      box_height = 196.0
      box_width = 810.0
      cx = 768.0
      cy = 682.0
      output = "eDP-1"
      placement_height = 864.0
      placement_width = 1536.0
      rotation = 0.0
      type = "login_box"
      [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[wallpaper]
  [wallpaper.default]
    path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"
  [wallpaper.last]
    path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"
