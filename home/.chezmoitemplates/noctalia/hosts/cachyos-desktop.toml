# Desktop-specific displays, wallpapers, plugins, and window controls.
# Private values remain in cachyos-desktop.age.
[bar.default.monitor.DP-1]
margin_edge = 2
margin_ends = 20
radius = 20
radius_bottom_left = 20
radius_bottom_right = 20
radius_top_left = 20
radius_top_right = 20

[bar.default.monitor.DP-3]
center = [ "media2" ]
end = [
    "clock",
    "tray2",
    "phone-connect",
    "calculator",
    "recorder",
    "weather",
    "launcher",
    "notifications",
    "volume",
    "shelly",
    "group:g1"
]
margin_edge = 2
margin_ends = 20
radius = 20
radius_bottom_left = 20
radius_bottom_right = 20
radius_top_left = 20
radius_top_right = 20
start = [ "umbriel-companion", "workspaces", "focus-column-left", "focus-column-right", "active_window2" ]

[bar.default.monitor.HDMI-A-1]
margin_edge = 2
margin_ends = 20
radius = 20
radius_bottom_left = 20
radius_bottom_right = 20
radius_top_left = 20
radius_top_right = 20

[calendar.account.personal_google]
color = "primary"
name = "Personlig kalender"
type = "google"

[control_center]
hidden_tabs = [ "monitor", "power" ]

    [control_center.calendar]
    show_week_numbers = true

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "clipboard"

    [[control_center.shortcuts]]
    type = "noctalia/screen_recorder:toggle"

[lockscreen_widgets]
widget_order = [
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@DP-3",
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@WL-1"
]

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
