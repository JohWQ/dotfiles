# Desktop-specific displays, wallpapers, plugins, and window controls.
# Private values remain in cachyos-desktop.age.
[bar.default.monitor.DP-3]
margin_edge = 2
margin_ends = 20
radius = 20
radius_bottom_left = 20
radius_bottom_right = 20
radius_top_left = 20
radius_top_right = 20
center = [ "media2" ]
start = [
    "workspaces",
    "focus-column-left",
    "focus-column-right",
    "active_window2"
]

    [calendar.account.personal_google]
    color = "primary"
    name = "Personlig kalender"
    type = "google"

[control_center]
hidden_tabs = [ "monitor", "power" ]
shortcuts = [ { "type" = "nightlight" }, { "type" = "notification" }, { "type" = "caffeine" }, { "type" = "clipboard" }, { "type" = "noctalia/screen_recorder:toggle" } ]

    [control_center.calendar]
    show_week_numbers = true

[lockscreen_widgets]
widget_order = [
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@DP-3",
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@WL-1"
]

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 540.0
    cy = 1596.4444580078125
    output = "DP-3"
    placement_height = 1920.0
    placement_width = 1080.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 659.3333740234375
    output = "HDMI-A-1"
    placement_height = 720.0
    placement_width = 1280.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
clipboard_image_action_command = "noctalia msg annotate {path}"

    [shell.screenshot]
    annotate = true
    close_on_copy = true
    copy_on_close = false

    [shell.window_switcher]
    show_count = true

["bar"."default"."monitor"."DP-1"]
margin_edge = 2
margin_ends = 20
radius = 20
radius_bottom_left = 20
radius_bottom_right = 20
radius_top_left = 20
radius_top_right = 20

