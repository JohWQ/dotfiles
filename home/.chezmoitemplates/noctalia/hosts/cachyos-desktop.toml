["plugins"]
enabled = [ "rylos/syncthing", "yuuto/calculator", "thaer99ob/default-apps", "h-jangra/keyviz", "icefish/phone-connect", "thepunkoff/pomodoro", "noctalia/screen_recorder", "noctalia/timer", "noctalia/wallhaven", "noctalia/world_clock", "joshuaslate/shelly", "noctalia/umbriel-companion" ]

