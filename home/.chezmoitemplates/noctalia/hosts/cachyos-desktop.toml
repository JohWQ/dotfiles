[plugins]
enabled = [
    "rylos/syncthing",
    "joshuaslate/shelly",
    "yuuto/calculator",
    "h-jangra/keyviz",
    "icefish/phone-connect",
    "thepunkoff/pomodoro",
    "noctalia/screen_recorder",
    "noctalia/timer",
    "noctalia/wallhaven",
    "noctalia/umbriel-companion",
    "thaer99ob/default-apps"
]

[shell]
clipboard_image_action_command = "noctalia msg annotate {path}"

    [shell.launcher]
    layout = "simple"

    [shell.screenshot]
    annotate = true
    close_on_copy = true
    copy_on_close = false

    [shell.window_switcher]
    show_count = true

[wallpaper.default]
path = "~/Pictures/Wallpapers/System/cachyos-wallpapers/Metal.png"

[wallpaper.last]
path = "~/Pictures/Wallpapers/System/cachyos-wallpapers/Metal.png"

[wallpaper.monitors.DP-1]
path = "~/Pictures/Wallpapers/System/cachyos-wallpapers/Metal.png"

[wallpaper.monitors.DP-3]
path = "~/Pictures/Wallpapers/System/cachyos-wallpapers/Metal.png"
