    "control-center",
    "wallpaper",
    "workspaces",
    "focus-column-left",
    "focus-column-right",
    "active_window2"
]

[calendar]
enabled = true

    [calendar.account.personal_google]
    color = "primary"
    name = "Personlig kalender"
