# -- mount -- #
[[mgr.prepend_keymap]]
on  = "M"
run = "plugin mount"

# -- Sudo -- #
[[mgr.prepend_keymap]]
on = ["R", "p", "p"]
run = "plugin sudo -- paste"
desc = "sudo paste"
[[mgr.prepend_keymap]]
on = ["R", "P"]
run = "plugin sudo -- paste --force"
desc = "sudo paste"
[[mgr.prepend_keymap]]
on = ["R", "o"]
run = "plugin sudo -- open"
desc = "sudo open editor"
[[mgr.prepend_keymap]]
on = ["R", "r"]
run = "plugin sudo -- rename"
desc = "sudo rename"
[[mgr.prepend_keymap]]
on = ["R", "p", "l"]
run = "plugin sudo -- link"
desc = "sudo link"
[[mgr.prepend_keymap]]
on = ["R", "p", "r"]
run = "plugin sudo -- link --relative"
desc = "sudo link relative path"
[[mgr.prepend_keymap]]
on = ["R", "p", "L"]
run = "plugin sudo -- hardlink"
desc = "sudo hardlink"
[[mgr.prepend_keymap]]
on = ["R", "a"]
run = "plugin sudo -- create"
desc = "sudo create"
[[mgr.prepend_keymap]]
on = ["R", "D"]
run = "plugin sudo -- remove --permanently"
desc = "sudo delete"
[[mgr.prepend_keymap]]
on = ["R", "c"]
run = "plugin sudo -- chmod"
desc = "sudo chmod"

# -- diff -- #
[[mgr.prepend_keymap]]
on = [ "i", "d" ]
run  = "plugin diff"
desc = "Diff the selected with the hovered file"

# -- augment-command -- #
[[mgr.prepend_keymap]]
on = "h"
run = "plugin augment-command.leave"
desc = "Go back to the parent directory"
[[mgr.prepend_keymap]]
on = "l"
run = "plugin augment-command.enter"
desc = "Enter the child directory, or open the file"
[[mgr.prepend_keymap]]
on = ["<C-j>"]
run = ["leave", "arrow 1", "enter"]
desc = "Move the cursor down in the parent directory"
[[mgr.prepend_keymap]]
on = ["<C-k>"]
run = ["leave", "arrow -1", "enter"]
desc = "Move the cursor up in the parent directory"
[[mgr.prepend_keymap]]
on = "<Down>"
run = "plugin augment-command.arrow -- 15"
desc = "Move cursor down"
[[mgr.prepend_keymap]]
on = "<Up>"
run = "plugin augment-command.arrow -- -15"
desc = "Move cursor up"
[[mgr.prepend_keymap]]
on = "o"
run = "plugin augment-command.shell -- '$EDITOR %s' --block --exit-if-dir"
desc = "Open files with the default editor"
[[mgr.prepend_keymap]]
on = "r"
run = "plugin augment-command.rename -- --cursor=before_ext"
desc = "Rename a file or directory"
[[mgr.prepend_keymap]]
on = "d"
run = "plugin augment-command.remove"
desc = "Move the files to the trash"
[[mgr.prepend_keymap]]
on = "D"
run = "plugin augment-command.remove -- --permanently"
desc = "Permanently delete the files"
[[mgr.prepend_keymap]]
on = "+"
run = "plugin augment-command.create"
desc = "Add files to an archive"

# -- Chmod -- #
[[mgr.prepend_keymap]]
on   = [ "g", "c" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

# -- convert -- #
[[mgr.prepend_keymap]]
on = ["b", "p"]
run = "plugin convert -- --extension='png'"
desc = "Convert to PNG"
[[mgr.prepend_keymap]]
on = ["b", "j"]
run = "plugin convert -- --extension='jpg'"
desc = "Convert to JPG"
[[mgr.prepend_keymap]]
on = ["b", "w"]
run = "plugin convert -- --extension='webp'"
desc = "Convert to WebP"

# -- pref-by-location -- #
[[mgr.prepend_keymap]]
# Toggle Hidden
on = "."
run = [ "hidden toggle", "plugin pref-by-location -- save" ]
desc = "Toggle the visibility of hidden files"
[[mgr.prepend_keymap]]
# Linemode
on = [ "m", "s" ]
run = [ "linemode size", "plugin pref-by-location -- save" ]
desc = "Linemode: size"
[[mgr.prepend_keymap]]
on = [ "m", "c" ]
run = [ "linemode size_and_mtime", "plugin pref-by-location -- save" ]
desc = "Linemode: size & mtime"
[[mgr.prepend_keymap]]
on = [ "m", "p" ]
run = [ "linemode permissions", "plugin pref-by-location -- save" ]
desc = "Linemode: permissions"
[[mgr.prepend_keymap]]
on = [ "m", "b" ]
run = [ "linemode btime", "plugin pref-by-location -- save" ]
desc = "Linemode: btime"
[[mgr.prepend_keymap]]
on = [ "m", "m" ]
run = [ "linemode mtime", "plugin pref-by-location -- save" ]
desc = "Linemode: mtime"
[[mgr.prepend_keymap]]
on = [ "m", "o" ]
run = [ "linemode owner", "plugin pref-by-location -- save" ]
desc = "Linemode: owner"
[[mgr.prepend_keymap]]
on = [ "m", "n" ]
run = [ "linemode none", "plugin pref-by-location -- save" ]
desc = "Linemode: none"
[[mgr.prepend_keymap]]
# Any changes during disabled state won't be saved to save file.
on = [ ",", "t" ]
run = "plugin pref-by-location -- toggle"
desc = "Toggle auto-save preferences"
[[mgr.prepend_keymap]]
on = [ ",", "d" ]
run = "plugin pref-by-location -- disable"
desc = "Disable auto-save preferences"
[[mgr.prepend_keymap]]
# This will reset any preference changes for the current working directory (CWD)
# then fall back to the predefined preferences in init.lua or yazi.toml.
on = [ ",", "R" ]
run = "plugin pref-by-location -- reset"
desc = "Reset preference of cwd"
[[mgr.prepend_keymap]]
on = [ ",", "m" ]
run = [ "sort mtime --reverse=no", "linemode mtime", "plugin pref-by-location -- save" ]
desc = "Sort by modified time"
[[mgr.prepend_keymap]]
on = [ ",", "M" ]
run = [ "sort mtime --reverse", "linemode mtime", "plugin pref-by-location -- save" ]
desc = "Sort by modified time (reverse)"
[[mgr.prepend_keymap]]
on = [ ",", "b" ]
run = [ "sort btime --reverse=no", "linemode btime", "plugin pref-by-location -- save" ]
desc = "Sort by birth time"
[[mgr.prepend_keymap]]
on = [ ",", "B" ]
run = [ "sort btime --reverse", "linemode btime", "plugin pref-by-location -- save" ]
desc = "Sort by birth time (reverse)"
[[mgr.prepend_keymap]]
on = [ ",", "e" ]
run = [ "sort extension --reverse=no", "plugin pref-by-location -- save" ]
desc = "Sort by extension"
[[mgr.prepend_keymap]]
on = [ ",", "E" ]
run = [ "sort extension --reverse", "plugin pref-by-location -- save" ]
desc = "Sort by extension (reverse)"
[[mgr.prepend_keymap]]
on = [ ",", "a" ]
run = [ "sort alphabetical --reverse=no", "plugin pref-by-location -- save" ]
desc = "Sort alphabetically"
[[mgr.prepend_keymap]]
on = [ ",", "A" ]
run = [ "sort alphabetical --reverse", "plugin pref-by-location -- save" ]
desc = "Sort alphabetically (reverse)"
[[mgr.prepend_keymap]]
on = [ ",", "n" ]
run = [ "sort natural --reverse=no", "plugin pref-by-location -- save" ]
desc = "Sort naturally"
[[mgr.prepend_keymap]]
on = [ ",", "N" ]
run = [ "sort natural --reverse", "plugin pref-by-location -- save" ]
desc = "Sort naturally (reverse)"
[[mgr.prepend_keymap]]
on = [ ",", "s" ]
run = [ "sort size --reverse=no", "linemode size", "plugin pref-by-location -- save" ]
desc = "Sort by size"
[[mgr.prepend_keymap]]
on = [ ",", "S" ]
run = [ "sort size --reverse", "linemode size", "plugin pref-by-location -- save" ]
desc = "Sort by size (reverse)"
[[mgr.prepend_keymap]]
on = [ ",", "c" ]
run = [ "sort size --reverse=no", "linemode size_and_mtime", "plugin pref-by-location -- save" ]
desc = "Sort by size & mtime"
[[mgr.prepend_keymap]]
on = [ ",", "C" ]
run = [ "sort size --reverse", "linemode size_and_mtime", "plugin pref-by-location -- save" ]
desc = "Sort by size & mtime"
[[mgr.prepend_keymap]]
on = [ ",", "r" ]
run = [ "sort random --reverse=no", "plugin pref-by-location -- save" ]
desc = "Sort randomly"

# -- System-clipboard -- #
