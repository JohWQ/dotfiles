# -- zoom -- #
[[mgr.prepend_keymap]]
on   = "å"
run  = "plugin zoom 1"
desc = "Zoom in hovered file"
[[mgr.prepend_keymap]]
on   = "æ"
run  = "plugin zoom -1"
desc = "Zoom out hovered file"

# -- fuzzy grep -- #
[[mgr.prepend_keymap]]
on  = [ "*" ]
run = "plugin yafg"

# -- custom shell -- #
[[mgr.prepend_keymap]]
on = [ ":" ]
run = 'plugin custom-shell -- auto --interactive'
desc = "custom-shell as default"
