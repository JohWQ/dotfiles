{{- /* chezmoi:modify-template */ -}}
{{- /* Manage only Vim keys; preserve btop's locally saved settings. */ -}}
{{- $pattern := `(?m)^[\t ]*vim_keys[\t ]*=[^\r\n]*` -}}
{{- if regexMatch $pattern .chezmoi.stdin -}}
{{- .chezmoi.stdin | replaceAllRegex $pattern "vim_keys = true" -}}
{{- else -}}
{{- .chezmoi.stdin -}}
{{- if and .chezmoi.stdin (not (hasSuffix "\n" .chezmoi.stdin)) }}{{ "\n" }}{{ end -}}
{{- "vim_keys = true\n" -}}
{{- end -}}
