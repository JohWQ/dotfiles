[mgr]
sort_by      = "mtime"
sort_reverse = true
linemode     = "mtime"
show_hidden  = true
scrolloff    = 8
mouse_events   = [ "click", "scroll", "drag" ]

[preview]
wrap       = "yes"
# Image size
max_width  = 700
max_height = 1000

[opener]
edit = [
  # Order is important!
	{ run = 'start "" nvim.exe %s', orphan = true, desc = "Open Neovim in new instance", for = "windows" },
  #{ run = '\"C:\\Program Files\\Neovim\\bin\\nvim.exe\" %s', block = true, desc = "Editor", for = "windows" },
]
extract = [
  { run = "ya pub augmented-extract --list %s", desc = "Extract here" },
]

# [open]
# rules = [
#   # Media
#   { mime = "{audio,video}/*", use = [ "play", "reveal" ] },
# 
# ]

[[plugin.prepend_previewers]]
mime = "audio/*"
run = "exifaudio"

